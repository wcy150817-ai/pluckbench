<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PluckBench" />

    <!-- SEO TDH (Title 56 chars, Description 153 chars, Canonical) -->
    <title>Online Instrument Tuner, Metronome & Chords - PluckBench</title>
    <meta
      name="description"
      content="Free online instrument tuner with sustain-phase pitch lock, noise reduction, physical modeling guitar/guzheng/violin tones, metronome, and chord library."
    />
    <meta
      name="keywords"
      content="online instrument tuner, online guitar tuner, ukulele tuner, violin tuner, guzheng tuner, bass tuner, online metronome, guitar chords, decibel meter, PluckBench"
    />
    <link rel="canonical" href="https://www.pluckbench.com/" />

    <!-- OpenGraph / Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Online Instrument Tuner, Metronome & Chords - PluckBench" />
    <meta
      property="og:description"
      content="Studio-grade chromatic & instrument tuner with sustain-phase pitch lock, smart noise suppression, authentic acoustic timbres, metronome & chord library."
    />
    <meta property="og:url" content="https://www.pluckbench.com/" />

    <!-- JSON-LD Structured Data (SoftwareApplication + FAQPage without fabricated ratings per SOP) -->
    <script id="seo-json-ld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "PluckBench — Online Instrument Tuner, Metronome & Chord Library",
            "url": "https://www.pluckbench.com/",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Web, iOS, Android, macOS, Windows",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "featureList": [
              "Three-Stage Sustain Pitch Lock Chromatic & Instrument Tuner",
              "Hardware-Style Bandpass Noise Reduction & Smart Noisy Room Alert",
              "Karplus-Strong Physical Modeling Guitar, Ukulele, Guzheng, Erhu & Violin Reference Tones",
              "Precision Visual Metronome with Tap BPM",
              "Interactive Guitar & Ukulele Chord Fingering Library",
              "Pitch Ear Trainer & Acoustic Decibel Meter"
            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Why does a Plucked String Sound Sharp Immediately After Plucking?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "When you pluck a guitar, ukulele, or guzheng string, initial finger displacement temporarily increases string tension, causing a 15-40 cent sharp pitch chirp during the first 80-120 milliseconds. PluckBench uses a 3-stage sustain-phase pitch tracker that filters out the attack transient and locks onto the true harmonic fundamental frequency."
                }
              },
              {
                "@type": "Question",
                "name": "How Can I Tune Accurately in a Noisy Room or Rehearsal Space?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Enable Noise Shield in the top toolbar and lock your target string manually. PluckBench applies a high-Q bandpass filter centered around the selected string frequency and rejects non-periodic ambient chatter or fan hum."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body class="bg-[#070a0f] text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
